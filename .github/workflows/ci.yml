name: CI/CD – Test, Build, and Deploy

# Trigger: runs whenever a PR is merged into the main branch (jdbc).
# A merge is a push event on the target branch, so listen on push.
on:
  push:
    branches:
      - jdbc   # this repo's main branch; change to "main" if that's the default branch name

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mn_playground
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Downloads Gradle 8.8 directly — no gradle-wrapper.jar needed.
      # Also handles Gradle dependency caching automatically.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # gradle build compiles, runs all tests, and assembles the shadow JAR.
      # Env vars override application.yaml so the test connects to the MySQL
      # service container above instead of the hardcoded dev IP.
      - name: Run tests and build shadow JAR
        env:
          DATASOURCES_DEFAULT_URL: jdbc:mysql://127.0.0.1:3306/mn_playground
          DATASOURCES_DEFAULT_USERNAME: root
          DATASOURCES_DEFAULT_PASSWORD: password
        run: gradle build

      # Upload the JAR so all bonus jobs below can download and use it
      # without rebuilding.
      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-crud-jar
          path: build/libs/*-all.jar
          retention-days: 30

  #BONUS 1: GitHub Releases
  # Creates a versioned release in the repo and attaches the JAR as a downloadable asset
  publish-github-release:
    name: Publish to GitHub Releases
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: micronaut-crud-jar
          path: build/libs/

      - name: Create GitHub Release and attach JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Automated release from commit `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
          files: build/libs/*.jar


